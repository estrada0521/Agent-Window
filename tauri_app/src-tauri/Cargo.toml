[package]
name = "agent-window-chat"
version = "0.0.0"
edition = "2021"
description = "Agent Window desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
window-vibrancy = "0.7.1"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSBezierPath", "NSColor", "NSFont", "NSImage",
    "NSBitmapImageRep", "NSImageRep", "NSMenuItem", "NSMenu", "NSResponder", "NSView", "NSScreen", "NSWorkspace",
    "NSAttributedString", "NSStringDrawing", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSGeometry", "NSArray", "NSDictionary", "NSURL", "NSThread",
] }
