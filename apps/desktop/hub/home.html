<!doctype html>
<html lang="en" data-theme="__THEME__" data-theme-desktop="__THEME_DESKTOP__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (() => {
      const appearance = window.__agentWindowAppearance = {
        themeKey: "agent_window_theme_desktop",
        textSizeKey: "agent_window_text_size",
        themeDefault: "__THEME_DESKTOP__",
        textSizeDefault: __TEXT_SIZE_DEFAULT__,
        textSizeMin: __TEXT_SIZE_MIN__,
        textSizeMax: __TEXT_SIZE_MAX__,
      };
      const storedTheme = String(localStorage.getItem(appearance.themeKey) || "").trim().toLowerCase();
      const theme = ["system", "light", "dark"].includes(storedTheme) ? storedTheme : appearance.themeDefault;
      const resolved = theme === "system"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : theme;
      document.documentElement.dataset.themeDesktop = theme;
      document.documentElement.dataset.theme = resolved;

      const storedSize = localStorage.getItem(appearance.textSizeKey);
      const size = storedSize === null
        ? appearance.textSizeDefault
        : Math.max(appearance.textSizeMin, Math.min(appearance.textSizeMax, Math.round(Number(storedSize))));
      document.documentElement.style.setProperty("--text-size", `${size}px`);
    })();
  </script>
  <meta name="theme-color" content="__DARK_BG__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__APP_DISPLAY_NAME__">
  <link rel="manifest" href="__HUB_MANIFEST_URL__">
  <link rel="icon" type="image/png" sizes="192x192" href="__PWA_ICON_192_URL__">
  <link rel="apple-touch-icon" href="__APPLE_TOUCH_ICON_URL__">
  <script>
    (() => {
      try {
        if (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform || "")) {
          const url = new URL(window.location.href);
          if (url.searchParams.get("view") !== "mobile") {
            url.searchParams.set("view", "mobile");
            window.location.replace(url.toString());
          }
        }
      } catch (_) {}
    })();
  </script>
  <script>
    (() => {
      if (!("serviceWorker" in navigator)) return;
      const isLocalHost = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === "[::1]";
      if (!(window.isSecureContext || isLocalHost)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/hub-service-worker.js", { scope: "/" }).catch((err) => {
          console.warn("hub service worker registration failed", err);
        });
      }, { once: true });
    })();
  </script>
  <title>__PAGE_TITLE__</title>
  <style>:root { --font-main: __MESSAGE_FONT_CSS__; --font-code: __CODE_FONT_CSS__; }</style>
