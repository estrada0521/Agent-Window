<!doctype html>
<html lang="en" data-theme="__THEME__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="__DARK_BG__">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__APP_DISPLAY_NAME__">
  <link rel="manifest" href="__CHAT_MANIFEST_URL__">
  <link rel="icon" type="image/png" sizes="192x192" href="__CHAT_PWA_ICON_192_URL__">
  <link rel="apple-touch-icon" href="__CHAT_APPLE_TOUCH_ICON_URL__">
  <title>__CHAT_DOCUMENT_TITLE__</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search || "");
      const inHubShell = params.get("hub_shell") === "1";
      if (inHubShell) {
        document.documentElement.dataset.hubShell = "1";
        document.documentElement.dataset.hubIframeChat = "1";
      }
      if (params.get("launch_shell") === "1") {
        document.documentElement.dataset.launchShell = "1";
      }
      try {
        const frameSidebarOpen =
          params.get("hub_sidebar") === "1" ||
          (window.frameElement && window.frameElement.dataset && window.frameElement.dataset.hubSidebarOpen === "1");
        if (frameSidebarOpen) {
          document.documentElement.dataset.hubSidebarOpen = "1";
        }
      } catch (_) {}
      // Detect Tauri desktop app via URL param, session marker, Tauri globals, or parent frame flag.
      function _detectTauri() {
        try {
          const stored = sessionStorage.getItem("agent_window_tauri_app") === "1";
          if (
            params.get("tauri") === "1" ||
            stored ||
            typeof window.__TAURI__ !== "undefined" ||
            typeof window.__TAURI_INTERNALS__ !== "undefined" ||
            (window.parent !== window && window.parent.__agentWindowNative?.appSettingsLoaded)
          ) {
            document.documentElement.dataset.tauriApp = "1";
            try { sessionStorage.setItem("agent_window_tauri_app", "1"); } catch (_) {}
            return true;
          }
        } catch (_) {}
        return false;
      }
      if (!_detectTauri()) {
        window.addEventListener("load", _detectTauri, { once: true });
      }
    })();
  </script>
__CHAT_MAIN_STYLE_BLOCK____CHAT_SHELL_STYLE_BLOCK__  <style id="chatFontSettingsStyle">
__AGENT_FONT_MODE_INLINE_STYLE__
  </style>
</head>
<body>
  <div id="fileDropdown"></div>
  <div id="cmdDropdown"></div>
  <section class="shell">
    __CHAT_HEADER_HTML__
    <main id="messages"></main>
    <button type="button" id="scrollToBottomBtn" title="Scroll to bottom" aria-label="Scroll to bottom"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
__CHAT_COMPOSER_HTML__  </section>
  <aside id="desktopRightPanel" class="desktop-right-panel" hidden>
    <div id="desktopRightPanelResizer" class="desktop-right-panel-resizer" aria-hidden="true"></div>
    <div class="desktop-right-panel-card">
      <div class="dp-split-panel" id="dpSplitPanel">
        <div id="dpGitContent" class="dp-split-pane dp-split-pane-git active"></div>
        <div id="dpSplitDivider" class="dp-split-divider" aria-hidden="true"></div>
        <div id="dpRepoContent" class="dp-split-pane dp-split-pane-repo active"></div>
      </div>
    </div>
  </aside>
  <aside id="gitPinnedSummaryAside" class="git-pinned-summary-aside" hidden aria-label="未コミット差分の概要（固定表示）">
    <div id="gitPinnedSummaryInner" class="git-summary-wrap"></div>
  </aside>
__CHAT_APP_SCRIPT_BLOCK__</body>
</html>
