<button type="button" class="chat-control-btn" id="chatMenuBtn" aria-label="Menu" title="Menu [⌘.]">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
    <line x1="4" y1="9" x2="20" y2="9"></line>
    <line x1="10" y1="15" x2="20" y2="15"></line>
  </svg>
</button>
<button type="button" class="chat-control-btn" id="chatReloadBtn" aria-label="Reload Chat" title="Reload Chat [⌘R]">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0.623 1.491) scale(0.8751)"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"></path></g></svg>
</button>
<button type="button" class="chat-control-btn" id="chatPanelToggle" aria-label="Toggle Git / Repo panel" title="Git / Repo [⌘E]" aria-pressed="false">
  <svg class="pane-outline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2.5"></rect><path d="M15 5v14"></path></svg>
  <svg class="pane-active-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="pane-active-fill" x="11" y="5.75" width="8.25" height="12.5" rx="1.4"></rect><rect x="4" y="5" width="16" height="14" rx="2.5"></rect><path d="M11 5v14"></path></svg>
</button>
